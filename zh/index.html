<h1>你會倒著說話嗎？</h1>
<p class="lead">Esrever 是一款適用於 iPhone 和 iPad 的倒放唱歌遊戲。錄一句話，聽它倒放，模仿倒放的聲音，再把你的模仿倒回來聽。你可以自己玩，想試幾次都行，也沒有廣告；也可以開派對模式，大家把手機傳來傳去一起玩。</p>
